# Merge into an existing configuration; never replace unrelated actions.
[daemon]
# kp-sync and rclone-config are installed in this venv.
script_dir = ["~/.local/udev/scripts", "~/.venvs/tools/bin"]

[devices.keepass-test-drive]
description = "Replace identity locally before enabling"
match = { fs_uuid = "REPLACE_FS_UUID", drive_serial = "REPLACE_DRIVE_SERIAL" }
tags = ["keepass", "rclone"]

# rclone-config up runs before kp-sync; its down runs after it, so the
# draining sync still finds the credentials.
[[actions]]
name = "rclone-config-up"
tag = "rclone"
on = ["startup", "mounted"]
run = ["rclone-config", "up", "{mountpoint}", "{drive_serial}:{fs_uuid}"]
lock = "rclone-config"
timeout = 30

[[actions]]
name = "keepass-attach"
tag = "keepass"
on = ["startup", "mounted"]
run = ["kp-sync", "--profile", "second-laptop", "drive-sync", "up", "--mode", "secondary", "--drive-id", "{drive_serial}:{fs_uuid}", "{mountpoint}"]
lock = "keydisk"
timeout = 120

[[actions]]
name = "keepass-detach"
tag = "keepass"
on = ["unmounted"]
run = ["kp-sync", "--profile", "second-laptop", "drive-sync", "down", "--mode", "secondary", "--drive-id", "{drive_serial}:{fs_uuid}"]
lock = "keydisk"
timeout = 120

[[actions]]
name = "rclone-config-down"
tag = "rclone"
on = ["unmounted", "shutdown"]
run = ["rclone-config", "down", "{mountpoint}", "{drive_serial}:{fs_uuid}"]
lock = "rclone-config"
timeout = 30
