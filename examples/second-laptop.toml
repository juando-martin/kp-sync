# Example profile for a laptop with a persistent hub on an encrypted disk
# (LUKS or ZFS native encryption). Configure rclone's "GoogleDrive" remote
# separately; no credentials belong in this file. Name the profile after
# the host: copy this file to ~/.config/kp-sync/HOST.toml after adapting
# paths, then follow "Setting up another machine" in examples/README.md.
# udevmon on this laptop calls the profile-specific attach/detach through
# drive-sync --mode secondary (udevmon/second-laptop.toml).
hub = "~/data/pass.kdbx"
hub_persistent = true
require_encrypted = true
key_file = "~/data/pass.keyx"

[[endpoints]]
name = "cloud"
type = "rclone"
remote = "GoogleDrive:kp"

[[endpoints]]
name = "pendrive"
type = "file"
source = "runtime"

[drives]
directory = "kp"
