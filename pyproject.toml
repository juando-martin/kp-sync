[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-sync"
version = "0.5.1"
description = "Synchronize a KeePass database across trusted copies"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Juan Domingo Martín", email = "juando.martin@gmail.com" }]
requires-python = ">=3.11"
keywords = ["keepass", "keepassxc", "kdbx", "sync", "merge", "rclone", "password"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Utilities",
]
dependencies = [
    "argcomplete>=3.0",
    "pykeepass>=4.2",
    "linux-keyctl",
]

[project.urls]
Homepage = "https://github.com/juando-martin/kp-sync"
Documentation = "https://kp-sync.readthedocs.io/"
Source = "https://github.com/juando-martin/kp-sync"
Issues = "https://github.com/juando-martin/kp-sync/issues"
Changelog = "https://github.com/juando-martin/kp-sync/blob/main/CHANGES.md"

[project.optional-dependencies]
keepassxc = ["keepassxc-proxy-client==0.1.7"]
docs = ["sphinx>=8,<10"]
dev = ["black>=26,<27", "pycodestyle>=2.14,<3"]

[tool.black]
line-length = 79
target-version = ["py311"]

[project.scripts]
kp-sync = "kp_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/man1/kp-sync.1"]
"share/man/man5" = ["man/man5/kp-sync-config.5"]
